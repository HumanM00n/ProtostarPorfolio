name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Une seule exécution par branche / PR : la plus récente annule les précédentes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  # ---------------------------------------------------------------------------
  # CI : lint + build sur chaque PR et chaque push sur main
  # ---------------------------------------------------------------------------
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (prod dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # CD : déploiement Preview sur chaque PR
  # (hors forks et Dependabot, qui n'ont pas accès aux secrets du repo)
  # ---------------------------------------------------------------------------
  deploy-preview:
    name: Deploy Preview (Vercel)
    needs: quality
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # lecture des commits/fichiers de la PR pour le récap Discord
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 🔍 Preview : $url" >> "$GITHUB_STEP_SUMMARY"

      # Récap de la PR + lien de la preview sur Discord (ignoré si aucun webhook n'est configuré).
      - name: Notifier Discord
        continue-on-error: true # un souci Discord ne doit jamais faire échouer le déploiement
        uses: actions/github-script@v8
        env:
          # Salon dédié aux previews si DISCORD_PREVIEW_WEBHOOK_URL existe, sinon salon des merges (DISCORD_PROD_WEBHOOK_URL).
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_PREVIEW_WEBHOOK_URL || secrets.DISCORD_PROD_WEBHOOK_URL }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          # Optionnel : secret « Protection Bypass for Automation » de Vercel. S'il existe, le lien envoyé
          # sur Discord ouvre la preview sans compte Vercel (choix assumé : salon Discord privé uniquement).
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        with:
          script: |
            const notify = require("./.github/scripts/discord-pr-summary.cjs");
            const url = new URL(process.env.PREVIEW_URL);
            if (process.env.VERCEL_BYPASS_SECRET) {
              url.searchParams.set("x-vercel-protection-bypass", process.env.VERCEL_BYPASS_SECRET);
              url.searchParams.set("x-vercel-set-bypass-cookie", "true"); // garde l'accès en naviguant sur le site
            }
            await notify({ github, context, core }, { kind: "preview", previewUrl: url.toString() });

  # ---------------------------------------------------------------------------
  # CD : déploiement Production sur push dans main
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy Production (Vercel)
    needs: quality
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Production : $url" >> "$GITHUB_STEP_SUMMARY"
