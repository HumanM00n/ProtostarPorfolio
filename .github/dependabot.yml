version: 2
updates:
  # Dépendances npm : une PR groupée par semaine (correctifs et versions mineures).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Actions GitHub utilisées par la CI/CD.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
